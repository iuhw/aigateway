# aigateway configuration for the Ollama end-to-end validation.
# Used by scripts/validate_e2e.py; assumes Ollama serving glm4:9b on 11434,
# plus `ollama cp glm4:9b glm4:9b-canary` and `ollama pull nomic-embed-text`.

server:
  # v1.0: admin surface is protected in the E2E (checks 10/16/18/21/22+ send
  # this key; proves the protected /metrics + /admin/* path live).
  admin_api_key: admin-e2e-key
  # v1.2: passthrough escape hatch exercised by check 29.
  passthrough:
    enabled: true

pricing:
  glm4:9b: {input_per_1k: 1.0, output_per_1k: 1.0}   # enables cost + budget checks

providers:
  ollama:
    type: openai
    base_url: http://127.0.0.1:11434/v1
    api_key: ollama
    supports_stream_usage_option: true
    max_connections: 32
  dead-upstream:
    # always-failing provider used to exercise retry/failover/fallback
    type: openai
    base_url: http://127.0.0.1:9
    api_key: none

models:
  glm4:9b:
    deployments:
      - provider: ollama
        model: glm4:9b
    canary:
      # M5 (check 21): only the `e2e-canary` virtual key is diverted to the
      # glm4-canary route; every other key stays stable (percent 0).
      target: glm4-canary
      percent: 0
      keys: [e2e-canary]
    policy:
      timeout_s: 300        # first inference loads the model into VRAM (slow)
      retries: 1
      retry_backoff_s: 1.0
      cooldown_s: 60
      allowed_fails: 3
      strategy: round_robin
  failover-demo:
    # dead upstream first, then real ollama deployment -> proves failover
    deployments:
      - provider: dead-upstream
        model: nonexistent
      - provider: ollama
        model: glm4:9b
    policy:
      timeout_s: 300
      retries: 0
      retry_backoff_s: 0.2
      cooldown_s: 3600      # keep dead upstream "in route" for the demo
      allowed_fails: 999999
      failover_on_client_error: true
  glm4-limited:
    deployments:
      - provider: ollama
        model: glm4:9b
    policy:
      timeout_s: 300
  glm4-canary:
    # canary twin of glm4:9b (same weights, distinct ollama tag) so the
    # served-model name in responses proves the diversion (check 21).
    # Prereq: ollama cp glm4:9b glm4:9b-canary
    deployments:
      - provider: ollama
        model: glm4:9b-canary
    policy:
      timeout_s: 300
      retries: 1
      retry_backoff_s: 1.0
      cooldown_s: 60
      allowed_fails: 3
  embed-mdl:
    # embeddings route for the semantic cache (check 25)
    deployments:
      - provider: ollama
        model: nomic-embed-text
    policy:
      timeout_s: 120
  vision-mdl:
    # small vision model for the multimodal checks (27/28).
    # Prereq: ollama pull moondream
    deployments:
      - provider: ollama
        model: moondream
    policy:
      timeout_s: 300

plugins:
  auth-plugin:
    config:
      header: Authorization
      allow_anonymous: false
      api_keys:
        - key: sk-e2e-demo-key
          name: e2e-tester
        - key: sk-e2e-canary-key
          name: e2e-canary
  keyword-block:
    plugin: keyword-filter-plugin
    order: 20
    config:
      words: ["敏感词", "forbidden-topic"]
      mode: block
      check: [request]
      block_message: "E2E: request blocked by keyword filter."
  keyword-mask:
    plugin: keyword-filter-plugin
    order: 25
    config:
      words: ["机密"]
      mode: mask
      check: [response]
  response-cache-plugin:
    config:
      ttl_s: 600
  rate-limit-plugin:
    config:
      model_rpm: {"glm4-limited": 2}
      default_rpm: 100000
  request-log-plugin:
    config:
      path: logs/e2e-requests.jsonl
      log_prompt: false
  # ---- M3 guardrails (validated by checks 14-16 in validate_e2e.py) ----------
  pii-redaction-plugin:
    config:
      groups: [phone, email, id_card, bank_card]
      action: mask
      check: [request, response]
  prompt-guard-plugin:
    config:
      action: block                 # E2E prompts are benign (0 FP on the sample set)
      threshold: 1.0
  webhook-review-plugin:
    # validate_e2e.py starts a local allow-stub on this port before the app.
    config:
      url: "http://127.0.0.1:11439/review"
      timeout_s: 2.0
      check: [request]
  # ---- M4 observability (validated by checks 17-19 in validate_e2e.py) --------
  otel-export-plugin:
    # validate_e2e.py starts a local OTLP/HTTP collector stub on this port.
    config:
      endpoint: "http://127.0.0.1:11440/v1/traces"
      timeout_s: 2.0
  usage-report-plugin:
    config:
      retention_hours: 24
  # ---- M2 semantic cache (validated by check 25 in validate_e2e.py) ----------
  semantic-cache-plugin:
    config:
      embed_model: embed-mdl        # routed to ollama nomic-embed-text
      # 0.9 measured: paraphrase pair 0.9489 (hit), cross-prompt 0.8586 (no hit)
      similarity_threshold: 0.9
      ttl_s: 600
      max_entries: 256
  # ---- M5 (validated by checks 20-21 in validate_e2e.py) ----------------------
  prompt-template-plugin:
    # Scoped to the glm4 models so the rest of the E2E run is unaffected.
    config:
      templates:
        - models: ["glm4:9b", "glm4-canary"]
          system: "You are the aigateway E2E assistant. CRITICAL: every reply must end with the exact token [[E2E-M5-{key}]]."
