# aigateway example configuration.
# Copy to gateway.yaml and adjust. The config file is hot-reloaded on change.

server:
  host: 0.0.0.0
  port: 8080
  # Token estimation for limits/metrics when upstream usage is missing:
  # "unicode" (default, CJK-aware heuristic) or "tiktoken" (exact, needs
  # `pip install aigateway[tokenizer]`; falls back gracefully offline).
  # tokenizer: tiktoken
  # tokenizer_model: gpt-4o-mini
  # --- production hardening (uncomment for real deployments) ---
  # admin_api_key: "change-me"      # protects /metrics and /admin/*
  # max_body_bytes: 1048576         # 413 beyond this
  # max_messages: 128
  # max_message_chars: 200000
  # max_tracked_keys: 100           # cap distinct key labels in
  #                                 # gateway_key_cost_usd_total (overflow -> "other")
  # --- passthrough escape hatch (v1.2, default off) ---
  # Relays raw requests to a model's upstream via /v1/upstream/{model}/{path}:
  # auth/budget/rate limits/logs/metrics still apply; schema validation,
  # caches, canary and stream content filters do not. JSON bodies only.
  # passthrough:
  #   enabled: true

# ---- cost tracking -------------------------------------------------------
# Static per-model USD pricing; accumulates gateway_cost_usd_total by model.
# Tiered rates (optional): prompt-cache reads/writes billed at their own
# price, the uncached remainder at input_per_1k; missing cache rates fall
# back to input_per_1k (conservative).
# pricing:
#   glm4:9b: { input_per_1k: 0.0, output_per_1k: 0.0 }
#   gpt-4o-mini:
#     input_per_1k: 0.00015
#     output_per_1k: 0.0006
#     cache_read_per_1k: 0.000075    # OpenAI cached-input price
#   claude-sonnet-4:
#     input_per_1k: 0.003
#     output_per_1k: 0.015
#     cache_read_per_1k: 0.0003
#     cache_write_per_1k: 0.00375

# ---- shared state across instances --------------------------------------
# memory (default): limits are per-process. For N replicas/workers use redis:
# shared_state:
#   backend: redis
#   redis_url: redis://127.0.0.1:6379/0
#   key_prefix: aigw

# ---- upstream providers -------------------------------------------------
# `type: openai` speaks the OpenAI chat-completions protocol, which covers
# OpenAI itself, Ollama (/v1), vLLM, DeepSeek, Groq, Together, LM Studio, ...
providers:
  ollama:
    type: openai
    base_url: http://127.0.0.1:11434/v1
    # Ollama ignores the key; set one anyway so the header is well-formed.
    api_key: ollama
    supports_stream_usage_option: true
    max_connections: 64
  # openai:
  #   type: openai
  #   base_url: https://api.openai.com/v1
  #   api_key: ${OPENAI_API_KEY}
  # Native protocol adapters: the gateway speaks OpenAI internally and
  # translates to/from these upstreams, so one public model can chain
  # deployments across vendors (e.g. anthropic primary, openai fallback).
  # anthropic:
  #   type: anthropic
  #   api_key: sk-ant-...
  #   # base_url: https://api.anthropic.com   (default)
  #   # default_max_tokens: 4096              (Anthropic requires max_tokens)
  # gemini:
  #   type: gemini
  #   api_key: AIza...
  #   # base_url: https://generativelanguage.googleapis.com  (default)
  # bedrock:
  #   type: bedrock
  #   region: us-east-1
  #   # credentials fall back to AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
  #   # AWS_SESSION_TOKEN environment variables when omitted here
  #   # access_key_id: AKIA...
  #   # secret_access_key: ...

# ---- model routes ---------------------------------------------------------
# Each public model name maps to one or more deployments. Routing strategies:
# round_robin | weighted | least_latency. Lower `priority` is preferred; the
# next tier is only used while all lower-tier deployments cool down.
# `fallbacks` names other model routes to try when every deployment failed.
# `canary` (M5) diverts a percentage of traffic to another configured model
# route: sticky per virtual-key identity (blake2b hash into 10k buckets),
# per-request chance for anonymous traffic; `keys` force-lists identities into
# the canary, `exclude_keys` pins them to stable. The served model name is
# what metrics/pricing/reports record; the split is counted in
# gateway_canary_requests_total{model, branch}.
models:
  glm4:9b:
    deployments:
      - provider: ollama
        model: glm4:9b
    policy:
      timeout_s: 120
      retries: 1
      cooldown_s: 30
      allowed_fails: 2
      strategy: round_robin
  # gpt-4o:
  #   deployments:
  #     - provider: openai
  #       model: gpt-4o
  #   canary:                         # M5 gradual rollout (opt-in)
  #     target: gpt-4o-canary         # another configured model route
  #     percent: 10                   # share diverted to the target
  #     keys: [beta-testers]          # optional: always-canary identities
  #     exclude_keys: [vip]           # optional: never-canary identities
  #     salt: "round-1"               # optional: reshuffle assignments
  # gpt-4o-canary:
  #   deployments:
  #     - provider: openai
  #       model: gpt-4o-2026-06-preview
  #   fallbacks: [gpt-4o]             # canary route may fall back to stable

# ---- plugins (order configurable via `order`, lower runs first) -----------
plugins:
  auth-plugin:
    config:
      header: Authorization
      allow_anonymous: true          # flip to false in production
      api_keys:
        - key: sk-demo-123456
          name: demo
          models: null               # null = all models
          rpm: 120
          # budgets: {daily_usd: 5, monthly_usd: 50}   # hard spend caps
          #                                            # (429 budget_exceeded)
          # token_quota: {daily: 1000000, monthly: 20000000}
          #                                            # token caps per UTC window
          #                                            # (429 token_quota_exceeded)
          # expires_at: "2026-12-31T23:59:59+00:00"    # ISO-8601; expired -> 403
          # concurrency: 8        # max in-flight requests per key (per replica)
          # metadata: {team: ops} # free-form, echoed in /admin/keys
          # budget_fail_open: true     # ledger read failures allow requests (default)
          # dynamic_key_cache_s: 3     # /admin/keys dynamic-overlay cache TTL
  keyword-filter-plugin:
    config:
      words: ["敏感词", "weapon", "forbidden"]
      mode: block                    # block | mask
      check: [request, response]
      block_message: "Content rejected by keyword filter."
  response-cache-plugin:
    config:
      ttl_s: 300
      max_entries: 512
  rate-limit-plugin:
    config:
      # model_rpm: {"glm4:9b": 300}
      default_rpm: 600
      identity_rpm: 120
      # token 级限流（预扣估算，完成后按实际用量多退少补）：
      # token_rpm: {"glm4:9b": 200000}
      # identity_token_rpm: 50000
  request-log-plugin:
    config:
      # path: logs/requests.jsonl
      stdout: false
      log_prompt: false
      log_response: false
  # ---- M4 usage reports (/admin/usage "report" section; per-replica view) ----
  usage-report-plugin:
    config:
      max_records: 50000            # ring size (oldest dropped first)
      retention_hours: 24           # lookback window served by /admin/usage
  # ---- M5 prompt templates (opt-in; the reference request-rewrite plugin) ----
  # Injects a gateway-owned system prompt per model / virtual key. Variables:
  # {model}, {key}, static `variables`, identity metadata fields, and
  # allowlisted request headers. Unknown {placeholders} stay verbatim and
  # substituted values are never re-expanded. Modes: prepend (default) /
  # append / replace. Any plugin may rewrite ctx.payload["messages"] in
  # on_request the same way — this is the supported request-rewrite hook.
  # prompt-template-plugin:
  #   config:
  #     templates:
  #       - models: ["glm4:*"]            # fnmatch on requested model (optional)
  #         keys: ["team-a"]              # exact virtual-key names (optional)
  #         metadata: {tier: premium}     # identity-metadata subset (optional)
  #         system: "You are the {product} assistant for {team}."
  #         mode: prepend
  #         variables: {product: ACME}
  #         header_variables: [x-team]    # request headers exposed as {x_team}
  # ---- M3 safety guardrails (all opt-in; delete the block to disable) --------
  # pii-redaction-plugin:
  #   config:
  #     groups: [phone, email, id_card, bank_card]   # built-ins + custom_patterns
  #     custom_patterns: ["project-\\d{4}"]
  #     action: mask                  # mask | block (block -> 400 pii_detected)
  #     check: [request, response]
  #     holdback_chars: 128           # streaming safety window (>= longest pattern)
  # prompt-guard-plugin:
  #   config:
  #     action: flag                  # flag (observe) | block (400 prompt_injection_detected)
  #     threshold: 1.0                # score >= threshold counts as injection
  #     weights: {override: 1.0, delimiters: 1.0, role_override: 0.5, evasion: 0.5}
  #     custom_patterns: [{pattern: "acme-internal", weight: 0.5}]
  #     check: [request]              # response check is non-streaming only
  # webhook-review-plugin:
  #   config:
  #     url: "http://review-svc:8080/check"   # required, absolute
  #     headers: {authorization: "Bearer ..."}# extra auth headers if needed
  #     timeout_s: 2.0
  #     on_unavailable: fail-open     # fail-open | fail-close (503)
  #     check: [request, response]    # streamed responses reviewed after delivery
  #     max_text_chars: 20000
  # ---- M4 observability exports (opt-in; pip install 'aigateway[otel]') ------
  # otel-export-plugin:
  #   config:
  #     endpoint: "http://otel-collector:4318/v1/traces"   # required, absolute
  #     headers: {x-api-key: "..."}   # auth for SaaS backends if needed
  #     timeout_s: 5.0
