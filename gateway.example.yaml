  #     service_name: aigateway
  #     resource: {deployment.environment: prod}
  # langfuse-export-plugin:         # same OTLP machinery, Langfuse preset
  #   config:
  #     host: "https://cloud.langfuse.com"   # or self-hosted http://langfuse:3000
  #     public_key: "pk-lf-..."
