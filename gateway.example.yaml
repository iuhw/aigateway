# aigateway example configuration.
# Copy to gateway.yaml and adjust. The config file is hot-reloaded on change.

server:
  host: 0.0.0.0
  port: 8080
  # --- production hardening (uncomment for real deployments) ---
  # admin_api_key: "change-me"      # protects /metrics and /admin/*
  # max_body_bytes: 1048576         # 413 beyond this
  # max_messages: 128
  # max_message_chars: 200000

# ---- cost tracking -------------------------------------------------------
# Static per-model USD pricing; accumulates gateway_cost_usd_total by model.
# pricing:
#   glm4:9b: { input_per_1k: 0.0, output_per_1k: 0.0 }
#   gpt-4o-mini: { input_per_1k: 0.00015, output_per_1k: 0.0006 }

# ---- shared state across instances --------------------------------------
# memory (default): limits are per-process. For N replicas/workers use redis:
# shared_state:
#   backend: redis
#   redis_url: redis://127.0.0.1:6379/0
#   key_prefix: aigw

# ---- upstream providers -------------------------------------------------
# `type: openai` speaks the OpenAI chat-completions protocol, which covers
# OpenAI itself, Ollama (/v1), vLLM, DeepSeek, Groq, Together, LM Studio, ...
providers:
  ollama:
    type: openai
    base_url: http://127.0.0.1:11434/v1
    # Ollama ignores the key; set one anyway so the header is well-formed.
    api_key: ollama
    supports_stream_usage_option: true
    max_connections: 64
  # openai:
  #   type: openai
  #   base_url: https://api.openai.com/v1
  #   api_key: ${OPENAI_API_KEY}
  # Native protocol adapters: the gateway speaks OpenAI internally and
  # translates to/from these upstreams, so one public model can chain
  # deployments across vendors (e.g. anthropic primary, openai fallback).
  # anthropic:
  #   type: anthropic
  #   api_key: sk-ant-...
  #   # base_url: https://api.anthropic.com   (default)
  #   # default_max_tokens: 4096              (Anthropic requires max_tokens)
  # gemini:
  #   type: gemini
  #   api_key: AIza...
  #   # base_url: https://generativelanguage.googleapis.com  (default)
  # bedrock:
  #   type: bedrock
  #   region: us-east-1
  #   # credentials fall back to AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
  #   # AWS_SESSION_TOKEN environment variables when omitted here
  #   # access_key_id: AKIA...
  #   # secret_access_key: ...

# ---- model routes ---------------------------------------------------------
# Each public model name maps to one or more deployments. Routing strategies:
# round_robin | weighted | least_latency. Lower `priority` is preferred; the
# next tier is only used while all lower-tier deployments cool down.
# `fallbacks` names other model routes to try when every deployment failed.
models:
  glm4:9b:
    deployments:
      - provider: ollama
        model: glm4:9b
    policy:
      timeout_s: 120
      retries: 1
      cooldown_s: 30
      allowed_fails: 2
      strategy: round_robin
  # gpt-4o-mini:
  #   deployments:
  #     - provider: openai
  #       model: gpt-4o-mini
  #   fallbacks: [glm4:9b]

# ---- plugins (order configurable via `order`, lower runs first) -----------
plugins:
  auth-plugin:
    config:
      header: Authorization
      allow_anonymous: true          # flip to false in production
      api_keys:
        - key: sk-demo-123456
          name: demo
          models: null               # null = all models
          rpm: 120
  keyword-filter-plugin:
    config:
      words: ["敏感词", "weapon", "forbidden"]
      mode: block                    # block | mask
      check: [request, response]
      block_message: "Content rejected by keyword filter."
  response-cache-plugin:
    config:
      ttl_s: 300
      max_entries: 512
  rate-limit-plugin:
    config:
      # model_rpm: {"glm4:9b": 300}
      default_rpm: 600
      identity_rpm: 120
      # token 级限流（预扣估算，完成后按实际用量多退少补）：
      # token_rpm: {"glm4:9b": 200000}
      # identity_token_rpm: 50000
  request-log-plugin:
    config:
      # path: logs/requests.jsonl
      stdout: false
      log_prompt: false
      log_response: false
