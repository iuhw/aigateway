global:
  scrape_interval: 10s

scrape_configs:
  - job_name: aigateway
    authorization:
      type: Bearer
      credentials: change-me-admin-key   # must match server.admin_api_key
    static_configs:
      # compose DNS round-robins the replica tasks; Prometheus scrapes the
      # service name. For per-replica series use docker.sd or relabeling.
      - targets: ["gateway:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
