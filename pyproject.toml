[project]
name = "aigateway"
version = "1.2.1"
description = "A production-grade, extensible AI gateway exposing an OpenAI-compatible API with pluggable middleware (keyword filtering, rate limiting, auth, caching, observability)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "fakeredis>=2.26",
    "psutil>=6.0",
    "opentelemetry-sdk>=1.26,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.26,<2",
]
redis = [
    "redis>=5.0",
]
tokenizer = [
    "tiktoken>=0.7",
]
otel = [
    "opentelemetry-sdk>=1.26,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.26,<2",
]

[project.scripts]
aigateway = "aigateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: component-level tests (providers, router, plugins, estimators in isolation)",
    "integration: full app pipeline via create_app + ASGI transport",
]

[tool.mypy]
python_version = "3.12"
# Scope: the gateway package only (tests exercise behavior, not types).
files = ["src/aigateway"]
# Third-party untyped deps are isolated at the boundary; stricter settings can
# be adopted incrementally as annotations allow.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tiktoken"
# optional [tokenizer] extra: absent unless precise counting is enabled
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "B027",    # Plugin hook methods are intentionally no-op by default
    "ASYNC109", # timeout parameters are part of the Provider interface
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
# Ops scripts favor directness: long report lines, inline lambdas as payload
# builders, sync file writes inside async entry points are all fine there.
"scripts/*" = ["E501", "E731", "ASYNC240", "B905", "F841"]
"benchmarks/*" = ["E501", "E731"]
