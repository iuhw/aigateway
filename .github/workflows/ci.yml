name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run --no-sync ruff check src tests scripts benchmarks

      - name: Tests
        run: uv run --no-sync python -m pytest tests/ -q

      - name: Benchmark smoke (small n, CI variance tolerated)
        run: uv run --no-sync python benchmarks/bench_gateway.py --quick --out /tmp/bench.md --json /tmp/bench.json

      - name: Upload test report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: /tmp/bench.*

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t aigateway:${{ github.sha }} .
      - name: Smoke test image
        run: |
          docker run -d --name gw -p 8080:8080 \
            -v "$PWD/gateway.example.yaml:/etc/aigateway/gateway.yaml:ro" \
            aigateway:${{ github.sha }}
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://127.0.0.1:8080/healthz > /dev/null; then
              echo "healthz OK"; docker rm -f gw; exit 0
            fi
          done
          echo "gateway did not become healthy"; docker logs gw; docker rm -f gw; exit 1
